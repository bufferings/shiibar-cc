# CI: the same checks CLAUDE.md lists as the local commands, on every push
# to main and every pull request, plus the supply-chain checks DESIGN.md §10 requires from the
# start (--locked enforces the committed Cargo.lock; cargo-deny covers
# advisories / licenses / bans via deny.toml).
#
# The build/test job needs macOS: the app build (swift build) and swift
# test require it, and GitHub's macOS images ship the full Xcode that
# building and running the tests need. The pinned Rust toolchain comes from
# rust-toolchain.toml — rustup installs it automatically on the first
# cargo invocation. cargo-deny runs as a separate Linux job because the
# official action is a Docker action (Linux-only) and the check is
# platform-independent.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    # Rust + Swift builds and tests normally finish well under 15 minutes;
    # 30 leaves headroom for cold caches without letting a hang run for
    # GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Clippy (warning-free)
        run: cargo clippy --all-targets --locked -- -D warnings

      # Warnings fail the build, for the app and the test targets alike.
      # The test step passes the same flag so it reuses these build products.
      - name: App build (warning-free)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
        working-directory: app

      - name: App tests
        run: swift test -Xswiftc -warnings-as-errors
        working-directory: app

      # When the test process itself dies (an abort in the Swift runtime
      # prints one line and no test failure), the crash report is the only
      # place that names the crashing thread's frames. Print them into the
      # log. macOS writes the report a few seconds after the crash.
      - name: Print test crash reports
        if: failure()
        run: |
          sleep 20
          shopt -s nullglob
          reports=("$HOME"/Library/Logs/DiagnosticReports/*.ips)
          echo "crash reports: ${#reports[@]}"
          for report in "${reports[@]}"; do
            echo "== $report"
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          head, body = text.split("\n", 1)
          meta, data = json.loads(head), json.loads(body)
          print(meta.get("app_name"), meta.get("timestamp"))
          print("exception:", data.get("exception"))
          print("asi:", data.get("asi"))
          images = data.get("usedImages", [])
          for index, thread in enumerate(data.get("threads", [])):
              frames = thread.get("frames", [])
              if not thread.get("triggered") and index != 0:
                  continue
              print(f"-- thread {index} triggered={thread.get('triggered', False)} queue={thread.get('queue')}")
              for frame in frames[:80]:
                  image = images[frame["imageIndex"]].get("name", "?")
                  print("  ", image, frame.get("symbol", hex(frame.get("imageOffset", 0))))
          PY
          done

      # Some warnings only come from the optimizer, so the debug build above
      # does not show them. The release configuration is what the install
      # script and the release build use.
      - name: App release build (warning-free)
        run: swift build -c release -Xswiftc -warnings-as-errors
        working-directory: app

      - name: Cask template check (brew style)
        # Renders packaging/homebrew/shiibar-cc.rb with dummy placeholder
        # values and runs it through `brew style` so a Ruby syntax
        # error in the template fails CI immediately, instead of only
        # surfacing when bump-cask.yml renders it for real on a release
        # (macos-15 runners ship Homebrew preinstalled). The rendered file
        # goes into a throwaway tap directory under Homebrew's own Taps
        # directory and is passed as a path without `--cask`: with `--cask`,
        # the runner's Homebrew rejects a path ("Loading casks from paths,
        # URLs or Ruby source is not supported; use a cask name", seen in
        # this step's log on 2026-11-20).
        run: |
          tapdir="$(brew --repository)/Library/Taps/bufferings/homebrew-shiibar-cc-ci"
          mkdir -p "$tapdir/Casks"
          dummy_sha256="$(printf 'x%.0s' {1..64})"
          sed \
            -e "s/{{VERSION}}/0.0.0/g" \
            -e "s/{{SHA256}}/$dummy_sha256/g" \
            packaging/homebrew/shiibar-cc.rb \
            > "$tapdir/Casks/shiibar-cc.rb"
          brew style "$tapdir/Casks/shiibar-cc.rb"

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: cargo-deny (advisories / licenses / bans)
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2

  # Temporary investigation job. Keyboard scroll: the tests' window mode
  # (never shown or shown fully transparent). Test process abort ("freed
  # pointer was not the last allocation", seen in the first swift test run
  # of a job): each job runs the given test filters in order, starting
  # right after the build, and prints the [kbscroll-crash] steps, the
  # toolchain versions, and every thread of any crash report.
  investigate:
    name: investigate (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: transparent-a
            window: transparent
            filters: WebPaneKeyboardScrollTests WebPaneKeyboardScrollTests
          - name: transparent-b
            window: transparent
            filters: WebPaneKeyboardScrollTests WebPaneKeyboardScrollTests
          - name: transparent-c
            window: transparent
            filters: WebPaneKeyboardScrollTests WebPaneKeyboardScrollTests
          - name: transparent-d
            window: transparent
            filters: WebPaneKeyboardScrollTests WebPaneKeyboardScrollTests
          - name: hidden-a
            window: hidden
            filters: WebPaneKeyboardScrollTests WebPaneKeyboardScrollTests
          - name: hidden-b
            window: hidden
            filters: WebPaneKeyboardScrollTests WebPaneKeyboardScrollTests
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: App build (warning-free)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
        working-directory: app

      - name: Run test filters in order (${{ matrix.name }})
        working-directory: app
        env:
          KBSCROLL_WINDOW: ${{ matrix.window }}
          # Objective-C runtime logging: every exception thrown, with its
          # backtrace, to find an exception that unwinds out of a test.
          OBJC_PRINT_EXCEPTIONS: "YES"
          OBJC_PRINT_EXCEPTION_THROW: "YES"
        run: |
          echo "variant ${{ matrix.name }}: KBSCROLL_WINDOW=$KBSCROLL_WINDOW filters: ${{ matrix.filters }}"
          i=0
          failed=0
          for filter in ${{ matrix.filters }}; do
            i=$((i + 1))
            log="$RUNNER_TEMP/run-$i.log"
            set +e
            swift test -Xswiftc -warnings-as-errors --filter "$filter" > "$log" 2>&1
            code=$?
            set -e
            echo "::group::run $i filter=$filter exit=$code"
            echo "run $i filter $filter exit code $code"
            grep -F '[kbscroll-crash]' "$log" || true
            grep -E "\[kbscroll-diag\] .* attempt=1 scrollTop" "$log" || true
            grep -E "Test Case '.*(started|passed|failed)" "$log" || true
            grep -E 'error:|signal code|freed pointer' "$log" || true
            echo "objc exception log lines: $(grep -c 'objc\[' "$log" || true)"
            if [ "$code" -ne 0 ]; then
              failed=$((failed + 1))
              echo "---- full log of run $i"
              cat "$log"
            fi
            echo "::endgroup::"
          done
          echo "${{ matrix.name }}: $failed failed of $i"
          [ "$failed" -eq 0 ]

      - name: Print test crash reports
        if: always()
        run: |
          sleep 20
          shopt -s nullglob
          reports=("$HOME"/Library/Logs/DiagnosticReports/*.ips)
          echo "crash reports: ${#reports[@]}"
          for report in "${reports[@]}"; do
            echo "== $report"
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          head, body = text.split("\n", 1)
          meta, data = json.loads(head), json.loads(body)
          print(meta.get("app_name"), meta.get("timestamp"))
          print("exception:", data.get("exception"))
          print("asi:", data.get("asi"))
          print("termination:", data.get("termination"))
          images = data.get("usedImages", [])
          for index, thread in enumerate(data.get("threads", [])):
              frames = thread.get("frames", [])
              print(f"-- thread {index} triggered={thread.get('triggered', False)} queue={thread.get('queue')} name={thread.get('name')}")
              for frame in frames[:40]:
                  image = images[frame["imageIndex"]].get("name", "?")
                  print("  ", image, frame.get("symbol", hex(frame.get("imageOffset", 0))))
          PY
          done
